name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src tests

      - name: Validate Block IR JSON Schema
        run: |
          layout-canvas schema > block_ir_schema.json
          python -c "import json, jsonschema; schema=json.load(open('block_ir_schema.json')); doc=json.load(open('examples/diffamp.json')); jsonschema.validate(doc, schema); print('Schema validation passed!')"

      - name: Test Block compilation and export
        run: |
          layout-canvas list-blocks
          layout-canvas compile examples/diffamp.json --out diffamp.gds

      - name: Run test suite
        run: |
          pytest -v --tb=short
