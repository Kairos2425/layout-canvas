# Release pipeline: tag v* → build → verify → PyPI (OIDC trusted
# publishing, no stored secrets) + GitHub Release with the wheel attached.
#
# One-time setup (documented in docs/RELEASING.md):
#   1. PyPI → Account → Publishing → "add a new pending publisher":
#      owner=Kairos2425 repo=layout-canvas workflow=release.yml
#      environment=pypi
#   2. GitHub repo → Settings → Environments → new environment "pypi"
#      (optional: require a reviewer before publish runs)
#
# Manual `workflow_dispatch` runs build+check only — the publish and
# github-release jobs are gated on refs/tags/v*.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel (fresh install + CLI entry point)
        run: |
          pip install dist/*.whl
          layout-canvas schema | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/layout-canvas
    permissions:
      id-token: write # OIDC trusted publishing — no API token in secrets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # To stage on TestPyPI first, set on the step:
        #   with:
        #     repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub Release with dist artifacts
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
