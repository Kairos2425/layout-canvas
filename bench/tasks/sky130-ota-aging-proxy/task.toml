schema_version = 1
id = "sky130-ota-aging-proxy"
type = "spec"
title = "OTA parametric aging proxy: BSIM4 delvto/mulu0 device stress + drift + supply-current EM budget"
deliverable = "starter/design.json"
pdk = "sky130"

# Baseline-compare tolerance for sim-derived values (deterministic checks
# always compare exactly).
[tolerances]
sim_rel = 0.05          # +/-5% of the frozen value
sim_abs = 0.0

[bounds]
# 2 op_schematic + 2 op_pex + 3 ac + 2 stress-corner + 3 aging-corner
# spec entries; partial credit is a fail reported on the individual
# spec.* checks (not re-bounded here).
"specs.total" = { equals = 12, deterministic = true, unit = "count" }
"ppa.area_um2" = { max = 2000.0, unit = "um2", deterministic = true }
