schema_version = 1
id = "sky130-optimize-specs"
type = "optimize"
title = "Spec-driven optimization: retune the OTA until outp_op lands in band"
deliverable = "starter/design.json"
pdk = "sky130"

# Bounded search: coordinate descent must conclude inside this budget.
[run]
objective = "specs"
testbench = "tb_op_schematic"
max_iterations = 6

[tolerances]
sim_rel = 0.05
sim_abs = 0.0

[bounds]
# Bounded rounds — exceeding the budget is a fail.
"optimize.iterations" = { max = 6, unit = "count", deterministic = true }
# The optimizer must reach all-specs-pass inside the budget.
"optimize.all_passed" = { equals = true, deterministic = true }
"ppa.area_um2" = { max = 2500.0, unit = "um2" }
